name: Build Tweak

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com
 ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Deb
        run: |
          make package FINALPACKAGE=1
          mkdir -p debs
          cp packages/*.deb debs/ || true
          
      - name: Update Packages List
        run: |
          echo "Package: com.animasikd.alwaysonnative" > Packages
          echo "Name: AlwaysOnNative" >> Packages
          echo "Version: 1.0.0" >> Packages
          echo "Architecture: iphoneos-arm64" >> Packages
          echo "Filename: debs/com.animasikd.alwaysonnative_1.0.0_iphoneos-arm64.deb" >> Packages
          echo "Description: Включение оригинального Always-On Display в настройках экрана!" >> Packages
          echo "Author: animasikd" >> Packages
          echo "Section: Tweaks" >> Packages
          
      - name: Commit & Push Changes
        run: |
          git config --local user.email
 "action@github.com"
          git config --local user.name
 "GitHub Action"
          git add debs/* Packages || true
          git commit -m "Автоматическая сборка AlwaysOnNative" || true
          git push